[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
solc = "0.8.28"

# Strictly assign the official compiler numeric IDs to resolve parsing errors
ignored_error_codes = [9302, 9415]

[rpc_endpoints]
base = "https://base.org"
arbitrum = "https://ankr.com"
ethereum = "https://llamarpc.com"
